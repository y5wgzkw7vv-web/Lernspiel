<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#3b7d4b">
  <meta name="description" content="Victorias ruhiges Rechtschreib-Abenteuer für die 2. Klasse">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <title>Victorias Blockwelt</title>
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <button id="homeBtn" class="icon-btn" aria-label="Zur Startseite">⌂</button>
      <div class="brand"><span class="mini-cube" aria-hidden="true"></span><span>Victorias Blockwelt</span></div>
      <div class="star-pill" aria-label="Gesammelte Sterne">⭐ <span id="starTotal">0</span></div>
    </header>

    <main id="screen" tabindex="-1" aria-live="polite"></main>

    <footer class="footer">
      <button id="parentBtn" class="text-btn">🔒 Für Erwachsene</button>
      <button id="soundBtn" class="text-btn" aria-pressed="true">🔊 Ton an</button>
    </footer>
  </div>

  <div id="toast" class="toast" role="status" aria-live="assertive"></div>
  <div id="celebration" class="celebration" aria-hidden="true"></div>
  <input id="importFile" type="file" accept="application/json" hidden>

  <template id="mascotTemplate">
    <svg class="mascot" viewBox="0 0 180 180" role="img" aria-label="Mila Moosfunke, ein freundliches Blockwesen">
      <defs><linearGradient id="moss" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#91d45f"/><stop offset="1" stop-color="#3f8c54"/></linearGradient></defs>
      <path d="M44 44h92v92H44z" rx="18" fill="url(#moss)" stroke="#23553a" stroke-width="7"/>
      <path d="M54 36h25v22H54zm47 4h25v20h-25z" fill="#a8e777"/>
      <rect x="64" y="75" width="18" height="22" rx="6" fill="#fff"/><rect x="101" y="75" width="18" height="22" rx="6" fill="#fff"/>
      <circle cx="74" cy="87" r="6" fill="#26352f"/><circle cx="109" cy="87" r="6" fill="#26352f"/>
      <path d="M72 111q18 18 38 0" fill="none" stroke="#26352f" stroke-width="7" stroke-linecap="round"/>
      <path d="M31 73l19 12-18 12m117-24-19 12 18 12" fill="none" stroke="#f3b742" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="139" cy="39" r="8" fill="#ffd75e"/><path d="M139 18v10m0 22v10m-21-21h10m22 0h10" stroke="#ffd75e" stroke-width="6" stroke-linecap="round"/>
    </svg>
  </template>

  <script src="words.js"></script>
  <script src="app.js"></script>
</body>
</html>
